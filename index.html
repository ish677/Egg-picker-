<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Balot or Penoy?</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom, #ffebf2, #f0f8ff);
      font-family: 'Fredoka', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      overflow: hidden;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #ff1493;
      font-size: 3rem;
      margin-bottom: 20px;
    }

    .button-container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    button {
      padding: 15px 30px;
      font-size: 1.3rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .balot {
      background-color: #ff66b2;
      color: #fff;
    }

    .penoy {
      background-color: #a28ee4;
      color: #fff;
    }

    button:hover {
      transform: scale(1.1);
      opacity: 0.9;
    }

    .result {
      margin-top: 20px;
      text-align: center;
    }

    .result img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      margin-top: 15px;
      animation: bounce 1s infinite alternate;
    }

    .message {
      margin-top: 10px;
      font-size: 1.2rem;
      color: #e91e63;
      font-weight: bold;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    .confetti {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 999;
      overflow: hidden;
    }

    .confetti div {
      position: absolute;
      background-color: #ff1493;
      width: 10px;
      height: 10px;
      animation: confetti 1s linear infinite;
    }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(100vh) rotate(360deg); }
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Which egg are you, Irish?</h1>

  <div class="button-container">
    <button class="balot" onclick="pick('Balot')">Balot</button>
    <button class="penoy" onclick="pick('Penoy')">Penoy</button>
  </div>

  <div class="result" id="result"></div>

  <!-- Background Music -->
  <audio id="bgMusic" autoplay loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_4fc27229c9.mp3?filename=chill-music-11098.mp3" type="audio/mpeg">
  </audio>

  <div class="confetti" id="confetti"></div>

  <script>
    function pick(choice) {
      const resultDiv = document.getElementById('result');
      const confettiDiv = document.getElementById('confetti');
      let imgSrc = '';
      let message = '';

      if (choice === 'Balot') {
        imgSrc = 'https://images.unsplash.com/photo-1608039755400-e87e222dc899?auto=format&fit=crop&w=200&q=80';
        message = "You're full of surprises, just like a Balot! ❤️";
      } else {
        imgSrc = 'https://images.unsplash.com/photo-1585238341984-01704f9c35d4?auto=format&fit=crop&w=200&q=80';
        message = "You're sweet and comforting, just like a Penoy! 💖";
      }

      resultDiv.innerHTML = `
        <h2>You picked: ${choice}, Irish!</h2>
        <img src="${imgSrc}" alt="${choice}">
        <div class="message">${message}</div>
      `;

      // Confetti effect
      for (let i = 0; i < 100; i++) {
        let confettiPiece = document.createElement('div');
        confettiPiece.style.left = Math.random() * 100 + 'vw';
        confettiPiece.style.animationDuration = (Math.random() * 2 + 2) + 's';
        confettiPiece.style.animationDelay = (Math.random() * 2) + 's';
        confettiDiv.appendChild(confettiPiece);
      }
    }

    // Start music on user interaction (mobile-friendly)
    window.addEventListener('click', () => {
      const music = document.getElementById('bgMusic');
      music.play().catch(() => {});
    }, { once: true });
  </script>
</body>
</html>
